name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when the branch gets new commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # No secrets: the build must work for fork PRs and for anyone cloning it.
      - name: Build
        run: npm run build

